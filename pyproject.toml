[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uspector"
version = "1.0.3"
description = "Python library for TLS configuration and certificate inspection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Menahem Levinski" }
]
dependencies = [
    "cryptography>=44.0.0"
]

[project.scripts]
uspector = "uspector.cli:main"

[project.urls]
Homepage = "https://github.com/mennylevinski/uspector-net"
Repository = "https://github.com/mennylevinski/uspector-net"

[tool.hatch.build.targets.wheel]
packages = ["src/uspector"]