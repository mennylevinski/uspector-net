name: Linux Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install . requests pyinstaller

      - name: Create build entry point
        run: |
          cat > uspector_entry.py <<'PY'
          from uspector.cli import main

          if __name__ == "__main__":
              main()
          PY

      - name: Build executable
        run: |
          pyinstaller --clean --onefile \
            --name uspector \
            --paths src \
            --collect-all cryptography \
            --copy-metadata cryptography \
            --collect-all requests \
            --copy-metadata requests \
            --distpath dist/linux \
            uspector_entry.py

      - name: Test executable
        run: |
          ./dist/linux/uspector --help
          ./dist/linux/uspector tls --help
          ./dist/linux/uspector web --help
          file dist/linux/uspector

      - name: Upload Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: uspector-linux-x86_64
          path: dist/linux/uspector
